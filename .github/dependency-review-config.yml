# Configuration for dependency review action. The licenses are those of the org's cargo-deny policy
# (genai-rs/.github deny.toml).
fail-on-severity: moderate
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Unicode-DFS-2016
  - MPL-2.0
  - Unicode-3.0
  - CDLA-Permissive-2.0
  - Apache-2.0 WITH LLVM-exception
  - CC0-1.0
  - OpenSSL
comment-summary-in-pr: always
